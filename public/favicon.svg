<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="GB monogram">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1628" />
      <stop offset="1" stop-color="#020817" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9" />
      <stop offset="0.6" stop-color="#a5f3fc" />
      <stop offset="1" stop-color="#fcd34d" />
    </linearGradient>
  </defs>

  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#tile)" stroke="#67e8f9" stroke-opacity="0.35" stroke-width="2" />

  <!-- monogram: G + B -->
  <g fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- G -->
    <path d="M58 40 A24 24 0 1 0 58 88 L58 66 L44 66" />
    <!-- B -->
    <path d="M74 40 L74 88 L90 88 A12 12 0 0 0 90 64 L74 64 M90 64 A12 12 0 0 0 90 40 L74 40" />
  </g>
</svg>
